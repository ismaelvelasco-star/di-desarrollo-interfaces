th="3" stroke-dasharray="7 5" marker-end="url(#a1)"/><rect x="258" y="170" width="80" height="22" rx="11" fill="#6750A4"/><text x="298" y="185" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="bold">1 arrastra</text><line x1="391" y1="240" x2="628" y2="240" stroke="#79747E" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#a1)"/><rect x="468" y="248" width="90" height="22" rx="11" fill="#5E35B1"/><text x="513" y="263" text-anchor="middle" font-size="10" fill="#FFFFFF" font-weight="bold">2 selecciona</text><line x1="640" y1="300" x2="612" y2="300" stroke="#79747E" stroke-width="2" marker-end="url(#a1)"/><rect x="612" y="306" width="90" height="22" rx="11" fill="#2E7D32"/><text x="657" y="321" text-anchor="middle" font-size="10" fill="#FFFFFF" font-weight="bold">3 edita</text><rect x="30" y="436" width="900" height="44" rx="10" fill="#F5EFF7"/><text x="480" y="455" text-anchor="middle" font-size="12.5" fill="#1D1B20">1 ▸ Arrastras el componente de la Palette al lienzo   ·   2 ▸ Aparece en el Component Tree y su llamada en Code   ·   3 ▸ Lo seleccionas y ajustas sus Attributes</text><text x="480" y="472" text-anchor="middle" font-size="12" fill="#607D8B">Insertar = añadir la llamada · Eliminar = Supr (o borrar la llamada completa) · Las tres vistas son el MISMO código</text></svg>